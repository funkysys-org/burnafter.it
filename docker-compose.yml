# burnafter.it v2-mono — one compose file, two modes (design §5/§6.3)
#
#   all-in-one (default):  docker compose up -d
#     app + postgres + redis on one host.
#
#   multi-host (round-robin DNS scaling): on each app host set, in .env:
#     DATABASE_URL=postgres://user:pass@your-central-pg:5432/burnafter
#     REDIS_URL=redis://your-central-redis:6379/0
#   and start ONLY the app service (--no-deps skips the local
#   postgres/redis this file also defines):
#     docker compose up -d --no-deps app

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # multi-host hosts override these via .env; all-in-one uses the
      # compose-internal service names
      DATABASE_URL: ${DATABASE_URL:-postgres://burnafter:${POSTGRES_PASSWORD}@postgres:5432/burnafter}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  postgres:
    image: postgres@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
    # postgres:16-bookworm, digest-pinned (design §5)
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-burnafter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-burnafter}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-burnafter} -d ${POSTGRES_DB:-burnafter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    # no ports: — internal network only in all-in-one mode.
    # multi-host: uncomment and firewall to app hosts only.
    # ports:
    #   - "5432:5432"

  redis:
    image: redis@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
    # redis:7-bookworm, digest-pinned (design §5)
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    # sessions/limits only: redis is disposable by design (design §5)

volumes:
  pgdata:
