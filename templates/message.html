{% extends "base.html" %}
{% block title %}BurnAfterIt — New Shout{% endblock %}
{% block body %}
<div class="shout-form">
  <h2>Share Ephemeral Content</h2>
  <form id="shout-form"
        action="/post/text" method="post" enctype="multipart/form-data">
    <label for="data">Text</label>
    <textarea id="data" name="data" maxlength="10240" required></textarea>

    <label for="maxhits">Burn after (views)</label>
    <input id="maxhits" name="maxhits" type="number" min="1" max="100" value="1" required>

    <label for="maxtime">Or after (minutes)</label>
    <input id="maxtime" name="maxtime" type="number" min="1" max="1440" value="240" required>

    <button type="submit">Burn it after reading</button>
  </form>
  <p class="hint">Text shouts only in phase 1 — photo, audio, video via the API.</p>
</div>

<script>
function showResult(url) {
  const box = document.createElement('div');
  box.className = 'shout-result';
  const link = document.createElement('a');
  link.href = url;
  link.textContent = url;
  box.appendChild(link);
  const img = document.createElement('img');
  img.src = '/get_qrimg/text/' + url.split('/').pop();
  img.alt = 'QR code for the shout URL';
  img.width = 220;
  box.appendChild(img);
  document.querySelector('.shout-form').replaceWith(box);
}

document.getElementById('shout-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const res = await fetch(form.action, { method: 'POST', body: new FormData(form) });
  const body = await res.json().catch(() => null);
  if (res.ok && body && body.url) {
    showResult(location.origin + body.url);
  } else {
    alert((body && body.error) || 'Upload failed');
  }
});
</script>
{% endblock %}
