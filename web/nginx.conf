# burnafter.it v2-mono — nginx config (web tier)
# nginx-unprivileged listens on 8080 as uid 101.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── The ESC chat PAGE goes to the SPA too (same rule as /live) ────
    location ~ ^/chat/[A-Za-z0-9]+$ {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, noarchive" always;
        try_files $uri /index.html;
    }

    # ── The live PAGE goes to the SPA, NOT the API proxy ─────────────
    # /live/<hash> (exactly two segments) is a React Router route; the
    # generic API regex below would swallow it and Flask would 404
    # (live-reported on the maintainer's deploy). nginx evaluates regex
    # locations in FILE ORDER — this must stay BEFORE the API location.
    location ~ ^/live/[A-Za-z0-9]+$ {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, noarchive" always;
        try_files $uri /index.html;
    }

    # ── The gated API: proxied to the app service ──────────────────
    # (\/|$) anchors the prefix match: /postfix, /healthz etc. fall
    # through to the SPA instead of app-JSON 404s (gate minor #7)
    location ~ ^/(stream_any|post|meta|get_qrimg|health|live)(\/|$) {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;   # per-type caps are enforced by the app
        proxy_read_timeout 120s;
    }

    # CSP for the SPA document (gate minor #5): cage the React app —
    # media/blob for claimed content, data: for client-drawn QRs,
    # inline styles (the spec's style= attributes).
    # index.html: NEVER cached — after a rebuild browsers must see the
    # new hashed assets immediately (stale-index seam, live-reported).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, noarchive" always;
    }

    location / {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, noarchive" always;
        try_files $uri $uri/ /index.html;
    }

    # static assets with hashed names: cache hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
