# burnafter.it v2-mono — nginx config (web tier)
# nginx-unprivileged listens on 8080 as uid 101.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── The gated API: proxied to the app service ──────────────────
    # /stream_any/<type>/<hash>  — THE claim (fetch = burn)
    # /post/<type>               — create
    # /meta/<type>/<hash>        — non-consuming gate metadata
    # /get_qrimg/...             — QR PNG for raw/API clients
    # /health                    — liveness
    location ~ ^/(stream_any|post|meta|get_qrimg|health) {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;   # per-type caps are enforced by the app
        proxy_read_timeout 120s;
    }

    # ── SPA routes (React Router owns these paths) ──────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # static assets with hashed names: cache hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
